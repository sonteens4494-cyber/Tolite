<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Animated Explainer Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121f;--panel:#201d33;--ink:#f4f0ff;--mut:#a9a3c7;--acc:#ff6b81;--ok:#5be3a0}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px Prompt,'Noto Sans Thai',system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100dvh}
main{max-width:760px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
h1{font-size:18px;margin:4px 0}
.box{background:var(--panel);border-radius:14px;padding:12px}
button,select,label.btn{min-height:48px;border:0;border-radius:12px;background:#38325c;color:var(--ink);font:inherit;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
button.p{background:var(--acc);color:#fff}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
canvas{width:100%;max-height:68dvh;object-fit:contain;background:#000;border-radius:12px;display:block;margin:0 auto}
input[type=range]{flex:1;min-width:120px;height:48px}
small,.s{color:var(--mut);font-size:13px;line-height:1.5}
.sc{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #38325c}
.sc button{min-height:48px;min-width:56px}
#err{color:#ffb3bd}progress{width:100%;height:14px}
video{width:100%;max-height:60dvh;border-radius:12px}
</style></head><body><main>
<h1>สตูดิโอแอนิเมชันความรู้: ทำไมเวลาอึต้องเล่นโทรศัพท์?</h1>
<div class="box"><div class="row"><label class="btn p">1 นำเข้าเสียงพากย์ (MP3)<input id="f" type="file" accept="audio/*,.mp3" hidden></label></div>
<div class="s" id="info">ยังไม่ได้นำเข้าเสียง — เวลาโดยประมาณ ยังไม่ซิงก์กับเสียงจริง</div><div id="err"></div></div>
<canvas id="cv"></canvas>
<div class="box"><div class="row"><button id="play" class="p">เล่น</button><button id="stop">หยุด</button><button id="mute">ปิดเสียง</button><button id="fs">เต็มจอ</button><span id="tm">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"></div>

<script>

SC:[["S01","โทรศัพท์กับห้องน้ำ",0],["S02","ถ้าไม่มีโทรศัพท์",1],["S03","สมองกำลังเรียนรู้อะไร",3],["S04","ระบบรางวัลของสมอง",4],["S05","การสร้างความเคยชิน",6],["S06","ระบบขับถ่ายจริง",7],["S07","รีเฟล็กซ์การขับถ่าย",8],["S08","นั่งนานเกินไป",10],["S09","บทสรุป",13]],
HL:["โทรศัพท์","สมอง","ระบบรางวัล","ไส้ตรง","หูรูด","อุ้งเชิงกราน","ริดสีดวงทวาร","เบ่ง","ความเคยชิน"],

function sEnd(i){return i+1<st.length?st[i+1]:voice[1]}

/* ===== AUDIO ===== */
function ctx(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}

 $('sync').textContent='สถานะซิงก์: ประมาณการจากช่วงเงียบและน้ำหนักตัวอักษร (ไม่ใช่ forced alignment) — ตรวจและปรับจุดซิงก์ได้';buildSP();draw(0);}

function startAudio(at,dest){stopAudio();if(!buf)return;src=ac.createBufferSource();src.buffer=buf;const g=ac.createGain();g.gain.value=muted&&!dest?0:1;src.connect(g);g.connect(ac.destination);if(dest)g.connect(dest);src.start(0,at);t0=ac.currentTime;off=at}

function now(){return playing?(hasAudio?off+(ac.currentTime-t0):off+(performance.now()-t0)/1000):off}
$('play').onclick=()=>{if(playing){off=now();playing=false;stopAudio();$('play').textContent='เล่น';return}
 ctx();if(off>=dur)off=0;playing=true;$('play').textContent='พัก';if(hasAudio)startAudio(off);else t0=performance.now();loop()};
$('stop').onclick=()=>{playing=false;stopAudio();off=0;$('play').textContent='เล่น';draw(0)};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'เปิดเสียง':'ปิดเสียง';if(playing){off=now();startAudio(off)}};
$('fs').onclick=()=>{const r=cv.requestFullscreen||cv.webkitRequestFullscreen;r?r.call(cv):err('เบราว์เซอร์นี้ไม่รองรับเต็มจอ')};
$('safe').onclick=()=>{safe=!safe;draw(now())};
$('seek').oninput=e=>{off=e.target.value/1000*dur;if(playing){hasAudio?startAudio(off):t0=performance.now()}draw(off)};

function buildSP(){$('sp').innerHTML='';G.SC.forEach((s,i)=>{const d=document.createElement('div');d.className='sc';d.innerHTML=`<span>${s[0]} ${s[1]}<br><small id="t${i}"></small></span><button>−0.1</button><button>+0.1</button>`;
 const [b0,b1,b2]=[d.querySelector('span'),...d.querySelectorAll('button')];
 b0.onclick=()=>{off=st[s[2]];if(playing)startAudio(off);draw(off)};
 b1.onclick=()=>adj(s[2],-.1);b2.onclick=()=>adj(s[2],.1);$('sp').appendChild(d)});upd()}
function adj(k,d){if(k===0)return;st[k]=Math.max(st[k-1]+.2,Math.min(sEnd(k)-.2,st[k]+d));upd();draw(st[k]+.01);if(playing){off=st[k]+.01;startAudio(off)}}
function upd(){G.SC.forEach((s,i)=>{const a=st[s[2]],e=i+1<G.SC.length?st[G.SC[i+1][2]]:voice[1],el=$('t'+i);if(el)el.textContent=`${a.toFixed(2)}–${e.toFixed(2)}s · ${hasAudio?'approximate':'ประมาณ ไม่ซิงก์กับเสียงจริง'}`})}

 X.fillStyle='#5b6a86';rr(-.95*u,-2.9*u,1.9*u,1.1*u,.4*u,'#5b6a86','#2a1a33',3);

  X.strokeStyle='#1b1b24';X.lineWidth=.12*u;X.beginPath();const k=o.expr==='surprised'?-.75:o.expr==='worried'?-.5:-.6;X.moveTo(e-.3*u,k*u);X.lineTo(e+.3*u,(k-(o.expr==='worried'?-.15:.05))*u);X.stroke()});
